<!DOCTYPE html>
<html lang="en">
<head>
  <title>NexusHR · face ID · manual entry · team shifts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    :root {
      --primary: #0B2B40;
      --primary-light: #1A4A60;
      --accent: #0077B6;
      --accent-soft: #0096D6;
      --success: #2E7D32;
      --warning: #B76E00;
      --danger: #C44536;
      --background: #F5F7FA;
      --surface: #FFFFFF;
      --border: #DCE3EC;
      --text-primary: #1C2A3A;
      --text-secondary: #546E7A;
      --text-light: #7F8C9B;
      --shadow: 0 8px 30px rgba(0,0,0,0.05);
      --gradient-bg: linear-gradient(145deg, #0f172a, #1e293b, #0b2b40);
    }
    body {
      background: var(--gradient-bg);
      color: var(--text-primary);
      min-height: 100vh;
    }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 50%, #2a3f5e, #0a1a2f);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 30px, transparent 30px, transparent 60px);
      animation: shift 30s linear infinite;
    }

    @keyframes shift { 0% { transform: translate(-10%, -10%) rotate(0deg); } 100% { transform: translate(10%, 10%) rotate(10deg); } }

    .login-container {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 3rem;
      width: 500px;
      box-shadow: 0 30px 50px -20px #00000080;
      border: 1px solid rgba(255,255,255,0.5);
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .company-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .logo-icon {
      background: linear-gradient(145deg, var(--primary), var(--accent));
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -5px var(--accent);
    }

    .logo-icon i {
      font-size: 2rem;
      color: white;
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(145deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .role-tabs {
      display: flex;
      gap: 0.5rem;
      margin: 2rem 0;
      background: rgba(0,0,0,0.05);
      padding: 0.4rem;
      border-radius: 48px;
      flex-wrap: wrap;
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 0.8rem 0;
      border-radius: 40px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      min-width: 100px;
    }
    .role-tab.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-weight: 600;
    }

    .login-form { margin: 1.5rem 0; }
    .input-group { margin-bottom: 1.2rem; }
    .input-group label {
      display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .input-group input, .input-group select {
      width: 100%; padding: 1rem 1.2rem; border: 2px solid var(--border); border-radius: 16px;
      font-size: 1rem;
    }
    .login-btn {
      width: 100%; background: var(--accent); color: white; border: none; padding: 1rem;
      border-radius: 16px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 1rem;
    }
    .app-container { display: none; min-height: 100vh; background: var(--gradient-bg); }
    .app-container.active { display: flex; }

    .sidebar {
      width: 280px; background: rgba(255,255,255,0.85); backdrop-filter: blur(15px);
      border-right: 1px solid var(--border); padding: 2rem 1rem; overflow-y: auto;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      padding: 0 0.5rem;
    }

    .sidebar-logo .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
    }

    .sidebar-logo .logo-icon i {
      font-size: 1.5rem;
    }

    .sidebar-logo .logo-text {
      font-size: 1.5rem;
    }

    .user-profile {
      background: rgba(255,255,255,0.5); border-radius: 20px; padding: 1.5rem 1rem;
      text-align: center; margin-bottom: 2rem;
    }
    .user-profile img {
      width: 90px; height: 90px; border-radius: 18px; border: 3px solid white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08); object-fit: cover;
    }
    .user-profile h3 { margin-top: 0.8rem; font-size: 1.2rem; font-weight: 600; }
    .user-profile p { color: var(--text-light); font-size: 0.9rem; }

    .nav-item {
      padding: 0.9rem 1.2rem; margin: 0.2rem 0; border-radius: 16px;
      display: flex; align-items: center; gap: 12px; color: var(--text-secondary);
      font-weight: 500; cursor: pointer;
    }
    .nav-item i { width: 24px; font-size: 1.2rem; }
    .nav-item.active { background: var(--accent); color: white; }
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
    .top-bar {
      background: rgba(255,255,255,0.7); backdrop-filter: blur(10px);
      padding: 1.2rem 2rem; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--border);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .top-bar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .top-bar-logo .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .top-bar-logo .logo-icon i {
      font-size: 1.3rem;
    }

    .top-bar-logo .logo-text {
      font-size: 1.3rem;
    }

    .page-title { font-size: 1.6rem; font-weight: 600; color: var(--primary); }
    .logout-btn {
      background: none; border: 1px solid var(--border); padding: 0.5rem 1.5rem;
      border-radius: 40px; cursor: pointer; color: var(--text-secondary);
    }
    .content { padding: 2rem; }
    .card {
      background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
      border-radius: 24px; padding: 2rem; margin-bottom: 2rem;
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 1.3rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--primary);
      display: flex; align-items: center; gap: 0.8rem;
    }

    .id-card {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 24px; padding: 2rem; color: white; display: flex; gap: 2rem; flex-wrap: wrap;
    }
    .id-avatar {
      width: 120px; height: 120px; border-radius: 18px; border: 4px solid rgba(255,255,255,0.3);
      overflow: hidden;
    }
    .id-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .id-details {
      flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;
    }
    .id-field {
      background: rgba(255,255,255,0.1); border-radius: 16px; padding: 0.8rem 1rem;
    }
    .id-field label { font-size: 0.7rem; opacity: 0.7; display: block; margin-bottom: 0.2rem; }
    .id-field span { font-size: 1rem; font-weight: 600; }

    .face-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.2);
      border-radius: 40px;
      padding: 0.3rem 1rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .face-id-badge i {
      color: var(--success);
    }

    .form-row { margin-bottom: 1.2rem; }
    .form-row label {
      display: block; font-weight: 500; margin-bottom: 0.3rem; color: var(--text-secondary);
    }
    .form-row input, .form-row select {
      width: 100%; padding: 0.9rem 1.2rem; border: 2px solid var(--border);
      border-radius: 16px; font-size: 1rem;
    }
    .photo-upload { display: flex; align-items: center; gap: 1rem; }
    .photo-preview {
      width: 80px; height: 80px; border-radius: 16px; background: var(--background);
      border: 2px dashed var(--border); background-size: cover; background-position: center;
    }
    .btn {
      background: var(--accent); color: white; border: none; padding: 0.8rem 2rem;
      border-radius: 40px; font-weight: 500; cursor: pointer;
    }
    .btn-secondary {
      background: var(--background); color: var(--text-primary); border: 1px solid var(--border);
    }
    .btn-success {
      background: var(--success); color: white;
    }
    .btn-danger {
      background: var(--danger); color: white;
    }

    .project-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;
    }
    .project-tile {
      background: var(--background); border-radius: 20px; padding: 1.5rem;
      border-left: 5px solid var(--accent);
    }
    .badge {
      background: var(--background); border-radius: 40px; padding: 0.3rem 1.2rem;
      font-size: 0.85rem; display: inline-block; margin: 0.2rem;
    }

    .employee-row {
      display: flex; align-items: center; gap: 1rem; padding: 0.8rem; border-radius: 16px;
      cursor: pointer;
    }
    .employee-row:hover { background: var(--background); }
    .employee-row img { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; }

    .permission-table {
      width: 100%; border-collapse: collapse; margin-top: 1rem;
    }
    .permission-table th {
      text-align: left; padding: 1rem 0.5rem; color: var(--text-secondary);
      font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid var(--border);
    }
    .permission-table td {
      padding: 1rem 0.5rem; border-bottom: 1px solid var(--border);
    }
    .permission-check {
      width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;
    }
    .perm-actions button {
      background: none; border: 1px solid var(--border); padding: 0.3rem 1rem;
      border-radius: 30px; cursor: pointer; margin-right: 0.5rem;
    }

    .task-list {
      list-style: none; padding: 0;
    }
    .task-list li {
      background: var(--background); border-radius: 16px; padding: 1rem 1.5rem;
      margin-bottom: 0.8rem; display: flex; align-items: center; gap: 1rem;
    }
    .task-number {
      background: var(--accent); color: white; width: 32px; height: 32px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .error-message {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    .info-message {
      background: var(--background);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      color: var(--text-secondary);
      font-style: italic;
    }

    .toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 2000;
    }
    .toast {
      background: white; border-left: 6px solid var(--accent); border-radius: 16px;
      padding: 1rem 2rem; margin-bottom: 0.5rem; box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
<div class="login-page" id="loginPage">
  <div class="login-container">
    <div class="login-header">
      <div class="company-logo">
        <div class="logo-icon"><i class="fas fa-cubes"></i></div>
        <span class="logo-text">NexusHR</span>
      </div>
      <p style="color: var(--text-light);">enter your credentials</p>
    </div>
    <div class="role-tabs" id="roleTabs">
      <span class="role-tab active" data-role="employee">Employee</span>
      <span class="role-tab" data-role="teamleader">Team Leader</span>
      <span class="role-tab" data-role="hr">HR</span>
      <span class="role-tab" data-role="admin">Admin</span>
    </div>
    <div class="login-form">
      <div class="input-group">
        <label>Email / Username</label>
        <input type="text" id="loginEmail" placeholder="name@company.com" value="">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" value="">
      </div>
      <div class="input-group" id="hrField" style="display: none;">
        <label>HR Access Code</label>
        <input type="text" id="hrCode" placeholder="HR-2025">
      </div>
      <div class="input-group" id="tlField" style="display: none;">
        <label>Team Leader Passcode</label>
        <input type="text" id="tlCode" placeholder="TL-2025">
      </div>
      <button class="login-btn" onclick="handleLogin()">Sign in</button>
    </div>
  </div>
</div>

<div class="app-container" id="appContainer">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fas fa-cubes"></i></div>
      <span class="logo-text">NexusHR</span>
    </div>
    <div class="user-profile" id="userProfile">
      <img id="profileAvatar" src="https://ui-avatars.com/api/?name=User&background=0B2B40&color=fff&size=200">
      <h3 id="profileName">—</h3>
      <p id="profileRole">employee</p>
    </div>
    <ul class="nav-menu" id="navMenu" style="list-style:none;"></ul>
  </div>

  <div class="main-area">
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="top-bar-logo">
          <div class="logo-icon"><i class="fas fa-cubes"></i></div>
          <span class="logo-text">NexusHR</span>
        </div>
        <span class="page-title" id="pageTitle">Dashboard</span>
      </div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
    <div class="content" id="contentPane"></div>
  </div>
</div>
<div class="modal" id="empModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:3000;">
  <div style="background:white; border-radius:32px; padding:2rem; width:500px;">
    <div id="modalContent"></div>
    <button class="btn" onclick="closeModal()" style="margin-top:1rem;">Close</button>
  </div>
</div>

<script>
  let currentUser = { role: 'employee', name: null, id: null, faceId: false };
  let employees = [];           
  let teamLeaders = [];         
  let projects = [];           
  let shifts = [];             
  let promotions = [];
  let tasks = [];
  let nextId = 701;
  let nextTaskId = 2;
  let permissions = [];

  function updatePermissionsFromEmployees() {
    permissions = employees.map(emp => ({
      employee: emp.name,
      leave: false,
      overtime: false,
      wfh: false,
      access: true
    }));
  }

  function toast(msg, type='info') {
    let t = document.getElementById('toast') || (()=>{let c=document.createElement('div'); c.id='toast'; c.className='toast-container'; document.body.appendChild(c); return c;})();
    let d = document.createElement('div'); d.className = 'toast';
    d.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'info-circle'}"></i> ${msg}`;
    t.appendChild(d); setTimeout(()=>d.remove(), 3000);
  }

  document.querySelectorAll('.role-tab').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.role-tab').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('hrField').style.display = this.dataset.role === 'hr' ? 'block' : 'none';
      document.getElementById('tlField').style.display = this.dataset.role === 'teamleader' ? 'block' : 'none';
    });
  });

  window.handleLogin = function() {
    let role = document.querySelector('.role-tab.active').dataset.role;
    let email = document.getElementById('loginEmail').value.trim();
    let password = document.getElementById('loginPassword').value.trim();
    if (!email || !password) { toast('Email and password required', 'warning'); return; }
    
    if (role === 'hr') {
      let code = document.getElementById('hrCode').value.trim();
      if (code !== 'HR-2025') { toast('Invalid HR access code', 'warning'); return; }
    }
    if (role === 'teamleader') {
      let code = document.getElementById('tlCode').value.trim();
      if (code !== 'TL-2025') { toast('Invalid Team Leader passcode', 'warning'); return; }
    }

    let name = email.split('@')[0].replace(/\./g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    if (!name) name = 'User';
    
    currentUser = { role, name, id: null, faceId: false };
    
    if (role === 'teamleader' && !teamLeaders.includes(name)) {
      teamLeaders.push(name);
    }

    document.getElementById('profileName').innerText = name;
    document.getElementById('profileRole').innerText = role;
    document.getElementById('profileAvatar').src = `https://ui-avatars.com/api/?name=${name}&background=0B2B40&color=fff&size=200`;

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appContainer').classList.add('active');

    buildNav();
    navigate('dashboard');
    toast('Login successful. Start by creating your ID card.', 'success');
  };

  function buildNav() {
    let items = [];
    if (currentUser.role === 'employee') {
      items = [
        { icon:'fa-chart-pie', label:'Dashboard', id:'dashboard' },
        { icon:'fa-id-card', label:'My ID Card', id:'id-card' },
        { icon:'fa-tasks', label:'My Tasks', id:'tasks' },
        { icon:'fa-rocket', label:'Projects', id:'projects' },
        { icon:'fa-moon', label:'Shifts', id:'shifts' },
        { icon:'fa-star', label:'Promotions', id:'promotions' }
      ];
    } else if (currentUser.role === 'teamleader') {
      items = [
        { icon:'fa-chart-bar', label:'TL Dashboard', id:'dashboard' },
        { icon:'fa-users', label:'Team Members', id:'team-members' },
        { icon:'fa-tasks', label:'Assign Tasks', id:'assign-tasks' },
        { icon:'fa-clock', label:'Team Shifts', id:'team-shifts' },
        { icon:'fa-rocket', label:'Team Projects', id:'team-projects' }
      ];
    } else if (currentUser.role === 'hr') {
      items = [
        { icon:'fa-chart-bar', label:'HR Dashboard', id:'dashboard' },
        { icon:'fa-users', label:'Employees', id:'employees' },
        { icon:'fa-tasks', label:'All Tasks', id:'all-tasks' },
        { icon:'fa-rocket', label:'Projects', id:'all-projects' },
        { icon:'fa-moon', label:'Shifts', id:'all-shifts' },
        { icon:'fa-star', label:'Promotions', id:'all-promotions' },
        { icon:'fa-key', label:'Permissions', id:'permissions' },
        { icon:'fa-user-tie', label:'Assign to TL', id:'assign-to-tl' }
      ];
    } else {
      items = [
        { icon:'fa-eye', label:'Live Monitor', id:'monitor' },
        { icon:'fa-chart-line', label:'Analytics', id:'analytics' },
        { icon:'fa-history', label:'Activity Log', id:'activity' },
        { icon:'fa-shield', label:'Security', id:'security' },
        { icon:'fa-server', label:'System Health', id:'health' },
        { icon:'fa-database', label:'Backup', id:'backup' }
      ];
    }
    let html = '';
    items.forEach(i => { html += `<li class="nav-item" onclick="navigate('${i.id}')"><i class="fas ${i.icon}"></i><span>${i.label}</span></li>`; });
    document.getElementById('navMenu').innerHTML = html;
  }

  window.navigate = function(page) {
    document.getElementById('pageTitle').innerText = page.split('-').map(s=>s[0].toUpperCase()+s.slice(1)).join(' ');
    renderPage(page);
  };

  function renderPage(page) {
    let pane = document.getElementById('contentPane');
    if (page === 'dashboard') {
      if (currentUser.role === 'employee') pane.innerHTML = empDash();
      else if (currentUser.role === 'teamleader') pane.innerHTML = tlDash();
      else if (currentUser.role === 'hr') pane.innerHTML = hrDash();
      else pane.innerHTML = adminDash();
    } else if (page === 'id-card') pane.innerHTML = renderIDCard();
    else if (page === 'tasks') pane.innerHTML = renderMyTasks();
    else if (page === 'projects') pane.innerHTML = renderMyProjects();
    else if (page === 'shifts') pane.innerHTML = renderMyShifts();
    else if (page === 'promotions') pane.innerHTML = renderMyPromotions();
    else if (page === 'team-members') pane.innerHTML = renderTeamMembers();
    else if (page === 'assign-tasks') pane.innerHTML = renderAssignTasks();
    else if (page === 'team-shifts') pane.innerHTML = renderTeamShifts();
    else if (page === 'team-projects') pane.innerHTML = renderTeamProjects();
    else if (page === 'employees') pane.innerHTML = renderEmployees();
    else if (page === 'all-tasks') pane.innerHTML = renderAllTasks();
    else if (page === 'all-projects') pane.innerHTML = renderAllProjects();
    else if (page === 'all-shifts') pane.innerHTML = renderAllShifts();
    else if (page === 'all-promotions') pane.innerHTML = renderAllPromotions();
    else if (page === 'permissions') pane.innerHTML = renderPermissions();
    else if (page === 'assign-to-tl') pane.innerHTML = renderAssignToTL();
    else if (page === 'monitor') pane.innerHTML = renderMonitor();
    else if (page === 'analytics') pane.innerHTML = renderAnalytics();
    else if (page === 'activity') pane.innerHTML = renderActivity();
    else if (page === 'security') pane.innerHTML = renderSecurity();
    else if (page === 'health') pane.innerHTML = renderHealth();
    else if (page === 'backup') pane.innerHTML = renderBackup();
  }

  function empDash() { return `<div class="card"><h3 class="card-title">Welcome, ${currentUser.name}</h3><p>You have ${tasks.filter(t=>t.assignedTo===currentUser.name).length} active tasks. Please create your ID card first.</p></div>`; }
  function tlDash() { return `<div class="card"><h3 class="card-title">Team Leader Dashboard</h3><p>Manage your team from the left menu.</p></div>`; }
  function hrDash() { return `<div class="card"><h3 class="card-title">HR Dashboard</h3><p>Total employees: ${employees.length}</p></div>`; }
  function adminDash() { return `<div class="card"><h3 class="card-title">Admin Console</h3><p>System online · all services operational</p></div>`; }
  function renderIDCard() {
    if (!currentUser.id) return createIDForm();
    return `
      <div class="card">
        <h3 class="card-title"><i class="fas fa-id-card"></i> Employee ID Card</h3>
        <div class="id-card">
          <div class="id-avatar">

  window.setupFaceID = function() {
    toast('📸 Face ID setup initiated. Please look at the camera.', 'info');
    setTimeout(() => {
      currentUser.faceId = true;
      let empIndex = employees.findIndex(e => e.name === currentUser.name);
      if (empIndex !== -1) {
        employees[empIndex].faceId = true;
      }
      toast('✅ Face ID successfully enrolled!', 'success');
      navigate('id-card');
    }, 2000);
  };

  window.saveID = function() {
    let name = document.getElementById('idName')?.value.trim();
    if (!name) { document.getElementById('idError').innerText = 'Name is required'; return; }
    
    if (employees.some(e => e.name === name && e.name !== currentUser.name)) {
      document.getElementById('idError').innerText = 'Employee with this name already exists';
      return;
    }

    let file = document.getElementById('photoUpload').files[0];
    let photoPromise = new Promise((resolve) => {
      if (file) { let r = new FileReader(); r.onload = (e) => resolve(e.target.result); r.readAsDataURL(file); }
      else { resolve(`https://ui-avatars.com/api/?name=${name}&background=0B2B40&color=fff&size=200`); }
    });
    
    let enableFaceId = document.getElementById('enableFaceId')?.checked || false;
    
    photoPromise.then(photo => {
      let id = 'NX-' + nextId++;
      let dept = document.getElementById('idDept')?.value || 'General';
      let join = document.getElementById('idJoin')?.value || '2025-03-01';
      let email = document.getElementById('idEmail')?.value || name+'@nexus.com';
      let phone = document.getElementById('idPhone')?.value || '+1 555 1234';
      let newEmp = { name, id, dept, join, email, phone, photo, role: currentUser.role, faceId: enableFaceId };
      currentUser = { ...currentUser, ...newEmp };
      employees = employees.filter(e => e.name !== name);
      employees.push(newEmp);
      updatePermissionsFromEmployees();
      document.getElementById('profileName').innerText = name;
      document.getElementById('profileAvatar').src = photo;
      
      if (employees.length >= 2 && projects.length === 0) {
        projects.push({
          id: 1,
          name: 'Team Collaboration Project',
          lead: employees[0]?.name || 'Team Lead',
          status: 'active',
          deadline: '2025-06-30',
          members: employees.map(e => e.name)
        });
        shifts.push({
          id: 1,
          employee: employees[0]?.name,
          type: 'Day',
          time: '09:00-17:00',
          project: 'Team Collaboration Project'
        });
        shifts.push({
          id: 2,
          employee: employees[1]?.name,
          type: 'Evening',
          time: '14:00-22:00',
          project: 'Team Collaboration Project'
        });
      }
      
      if (enableFaceId) {
        toast('Face ID enabled successfully!', 'success');
      }
      toast('ID card created', 'success');
      navigate('id-card');
    });
  };

    return `<div class="card"><h3 class="card-title">All Promotions</h3>${promotions.map(p=>`<div class="badge">${p.employee} · ${p.from}→${p.to}</div>`).join('')}</div>`; 
  }

  window.closeModal = function() { document.getElementById('empModal').style.display = 'none'; };

  window.logout = function() {
    document.getElementById('appContainer').classList.remove('active');
    document.getElementById('loginPage').style.display = 'flex';
  };
</script>
</body>
</html>
